name: AI tagging

on:
  push:
    branches: [main]
    paths: ['posts/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tidy new posts and fill in topic, tags and excerpts
        id: tag
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/ai-tag.mjs
      - name: Save changes
        if: always()
        run: |
          if [ -s .ai-tag-summary.txt ] && [ -n "$(git status --porcelain -- posts)" ]; then
            git config user.name "hallowed-drafts-tagger"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A posts
            git commit -F .ai-tag-summary.txt
            git push
            if [ "${{ steps.tag.outcome }}" = "failure" ]; then exit 1; fi
          else
            echo "No changes to save."
          fi
